[project]
name = "movicol-data"
version = "0.4.0"
description = "ETL pipelines and data processing for MoviCol - Urban Mobility Graph"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "geopandas>=0.14.0",
    "networkx>=3.2",
    "requests>=2.31.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.14.0",
    "psycopg2-binary>=2.9.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

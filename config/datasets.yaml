# ═══════════════════════════════════════════════════════════════
# PENDIENTES — Fase 2 (post-MVP)
# ═══════════════════════════════════════════════════════════════
pendientes:
  - id: ecpz-jhmd
    name: siniestralidad_bogota_anuarios
    description: "Anuarios siniestralidad 2020-2024 con geolocalización precisa"
    format: xlsx
    source: datosabiertos.bogota.gov.co
    status: requires_login
    reason: "Requiere login institucional en datosabiertos.bogota.gov.co. Contiene lat/lon exacta de cada accidente."
    impact: alto

  - id: null
    name: demanda_pasajeros_postpandemia
    description: "Datos de demanda de pasajeros 2021-2025"
    format: csv
    source: datosabiertos.bogota.gov.co
    status: requires_login
    reason: "Los datos actuales son de 2020 (pandemia). Se necesitan datos actualizados para predicciones realistas."
    impact: alto

  - id: null
    name: gtfs_transmilenio
    description: "GTFS: horarios, frecuencias, tiempo real TransMilenio"
    format: gtfs
    source: transmilenio_sa
    status: not_public
    reason: "Transmilenio S.A. no publica GTFS abiertamente. Habilitaría predicción temporal real."
    impact: alto

  - id: 2gfp-jiqi
    name: red_semaforica_bogota
    description: "Red semafórica de Bogotá (1,462 intersecciones)"
    format: geojson
    source: arcgis_hub_sdm
    status: downloaded
    path: semaforos/red_semaforica_bogota.geojson

  - id: null
    name: ciclovias_bogota
    description: "Red de ciclovías y estaciones BiciTM"
    format: geojson
    source: ideca
    status: to_explore
    reason: "IDECA tiene datos geoespaciales de Bogotá. Agregaría capa de movilidad en bicicleta."
    impact: medio

  - id: null
    name: aforos_vehiculares
    description: "Aforos y velocidades vehiculares"
    format: csv
    source: simur_sdm
    status: to_explore
    reason: "SIMUR/SDM tiene datos de flujos vehiculares reales. Mejoraría predicción de congestión vehicular."
    impact: medio
